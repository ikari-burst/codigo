<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inv.TECH</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <style>
            #form{
                display: grid;
                gap: 10px;
                max-width: 400px;
                margin: 0 auto;
            }
            #form input, #form select, #form button{
                padding: 10px;
                font-size: 16px;
            }
            #msg{
                text-align: center;
                color: red;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header class="Encabezado">
            <div class="marca">
                <h1>Inv.TECH</h1>
                <img src="logo.jpg" alt="Logo de Inv.TECH" class="logo" width="200" height="100">
            </div>
            <nav class="navbar navbar-expand-lg menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="programas.html">Programas</a></li>
                    <li class="nav-item"><a class="nav-link" href="beneficios.html">Beneficios</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link Registro" href="registro.html">Registrarse</a></li>
                </ul>
            </nav>
        </header>
        <main class="contenido">
            <section id="registro" class="bloque">
                <h2>Registrese con Nosotros</h2>
                <form id="form">   
                    <input id="nombre" placeholder="Nombre">
                    <input id="correo" type="email" placeholder="Correo">
                    <input id="clave" type="password" placeholder="Contraseña">               
                    <select id="programa">
                        <option value="">Seleccione un programa</option>
                        <option value="programa1">Ciberseguridad</option>
                        <option value="programa2">Desarrollo de Software</option>
                        <option value="programa3">Inteligencia Artificial</option>
                        <option value="programa4">Redes y Comunicaciones</option>
                        <option value="programa5">Soporte Tecnico</option>
                    </select>
                    <label for="terminos">
                        <input type="checkbox" id="terminos"> Acepto los términos y condiciones
                    </label>
                    <button type="button" onclick="registrar()">Registrar</button>
                </form>
                <p id="msg"></p>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
